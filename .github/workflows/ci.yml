name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.python.outputs.services }}
      images: ${{ steps.python.outputs.images }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            core-api:
              - services/core-api/**
              - packages/api-client/openapi.json
              - scripts/check_licenses.py
              - .github/workflows/ci.yml
            ai-service:
              - services/ai-service/**
              - scripts/check_licenses.py
              - .github/workflows/ci.yml
            web:
              - apps/web/**
              - packages/**
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - scripts/check_licenses.py
              - .github/workflows/ci.yml
      - id: python
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          services=$(jq -c '[.[] | select(. == "core-api" or . == "ai-service")]' <<< "$CHANGED")
          echo "services=$services" >> "$GITHUB_OUTPUT"
          images=$(jq -c '[.[] | select(. == "core-api" or . == "ai-service" or . == "web")]' <<< "$CHANGED")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  python:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    # core-api's tests run on a real PostgreSQL and Redis. Started for every Python service: a
    # matrix job cannot pick its services per entry, and it only costs a few seconds.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # Rate limits (T1.6) are tested on a real Redis.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # Email tests (T1.5) send through a real SMTP server and read it back over its API.
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      CORE_TEST_DATABASE_URL: postgresql+psycopg://core:ci-only-password@localhost:5432/core_test
      CORE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: services/${{ matrix.service }}
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --locked
      - name: Licenses (ADR-0011)
        run: uv run --no-sync python ../../scripts/check_licenses.py python
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - name: Migrations on an empty database
        if: matrix.service == 'core-api'
        env:
          CORE_DATABASE_URL: ${{ env.CORE_TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter web...
      # T1.11: the committed types must match the committed openapi.json (core-api's pytest
      # checks openapi.json against the app).
      - name: API client is up to date
        run: |
          pnpm --dir packages/api-client generate
          git diff --exit-code packages/api-client
      # `web...`: also the dependencies of the workspace packages web uses (packages/*).
      - name: Licenses (ADR-0011)
        run: |
          pnpm licenses list --json --filter "web..." > "$RUNNER_TEMP/licenses.json"
          python3 scripts/check_licenses.py pnpm "$RUNNER_TEMP/licenses.json"
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  # Risk register R11: a broken Dockerfile shows up on the PR, not at the first deploy (T0.13).
  # Built, never pushed, for each service whose files changed (its filter covers its Dockerfile
  # and lockfile, and ci.yml itself).
  images:
    name: image ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (not pushed)
        run: |
          if [ "$IMAGE" = web ]; then
            docker build -f apps/web/Dockerfile -t "essity-$IMAGE" .
          else
            docker build -t "essity-$IMAGE" "services/$IMAGE"
          fi
      # R04, review 8765c30: without CORE_API_URL the production server must exit, naming it,
      # instead of starting and answering 500 to everyone.
      - name: web refuses to start without CORE_API_URL
        if: matrix.image == 'web'
        run: |
          set +e
          timeout 60 docker run --rm \
            -e WEB_ORIGIN=https://essity.example \
            -e WEB_TO_CORE_TOKEN="$(openssl rand -hex 24)" \
            -e WEB_TRUSTED_PROXY_HOPS=1 \
            essity-web > "$RUNNER_TEMP/web.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/web.log"
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "web kept running (exit $code) without CORE_API_URL"; exit 1
          fi
          grep -q "CORE_API_URL is required in production" "$RUNNER_TEMP/web.log"

  boundaries:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_cross_imports.py
      - name: Test repo scripts
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # Only history reachable from HEAD: fetch-depth 0 also fetches other branches,
      # and a leak on one PR's branch must not fail every other PR.
      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts=HEAD --config .gitleaks.toml \
            --redact --verbose --no-banner --exit-code 1

  ci-ok:
    name: CI ok
    needs: [changes, python, web, images, boundaries, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
