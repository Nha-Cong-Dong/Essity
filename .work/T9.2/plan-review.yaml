      Lưu thêm SHA-256 của (raw_text, ops); cùng command_id mà khác payload → 409 command_id_reused, không trả diff cũ.
    repro: "test đếm lời gọi parse-command (fake ai client): gửi cùng command_id hai lần → đúng 1 lời gọi"
