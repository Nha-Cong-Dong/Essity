    issue: >
      Kế hoạch mới thấy thiếu chỗ lưu cho StudyFilter và in_practice, nhưng còn bỏ sót ba chỗ khác.
      (a) Section và Question trong Snapshot có `rev`, còn doc_section và question không có cột version.
      (b) Section.studied không có cột; doc_section chỉ có `studied_weight`.
      (c) Question.card_id và section_id là một giá trị, còn DB nối nhiều-nhiều qua question_unit và question_section.
      (d) DB sửa đáp án bằng cách "retire và thay" (tạo id mới), còn Snapshot sửa tại chỗ.
      Hệ quả: kiểm `expected_rev` khi hoàn tác không có nguồn cho mục và câu. Nếu tự bịa rev lúc nạp, hoàn tác sẽ đè lên thay đổi tay → mất dữ liệu (AC5).
      Với thẻ, rev dự đoán (rev+1 mỗi lần đổi) có thể lệch unit.version thật mà service ADR-0028 ghi. Khi đó mọi hoàn tác trả changed_after, hoặc tệ hơn là khớp sai.
    fix: >
      T9.2b: thêm `version int NOT NULL DEFAULT 1` cho doc_section và question (service tay và lệnh cùng tăng), hoặc ghi rõ thao tác nào không hoàn tác được.
      Chốt cách ánh xạ studied, gắn lại câu (nhiều-nhiều) và sửa đáp án (retire/replace) vào Snapshot; bàn tech-expert, ghi bảng Quyết định.
      T9.2c: lấy `expected_rev` trong inverse_json từ rev đọc lại trong DB sau khi ghi (hoặc assert bằng rev lõi dự đoán), không tin lõi thuần.
    repro: "test: áp lệnh sửa khoảng trang mục 3.4, sửa tay mục đó qua OutlineService.edit_section, rồi undo → phải 409 changed_after; với thẻ chuẩn: assert inverse_json.expected_rev == knowledge_unit.version sau khi áp"
