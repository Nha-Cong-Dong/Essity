# Local development stack (ADR-0003). Start with `just up` from the repo root.
# Host ports bind to 127.0.0.1 only: nothing here should be reachable from the network.

name: essity

x-python-healthcheck: &python-healthcheck
  interval: 5s
  timeout: 3s
  retries: 10

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      CORE_DB_NAME: ${CORE_DB_NAME}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      AI_DB_NAME: ${AI_DB_NAME}
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. MinIO no longer publishes images; RustFS is a drop-in
  # replacement for local use. Production uses Cloudflare R2 (ADR-0012).
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # web console: http://localhost:9001/rustfs/console/
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || wget -qO- http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-init:
    image: amazon/aws-cli:2.37.9
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./storage/init.sh:/init.sh:ro
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"

  # Catches every email sent locally. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"  # web UI
      - "127.0.0.1:1025:1025"  # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces (ADR-0013): services -> Collector (OTLP/HTTP :4318) -> Jaeger.
  # Neither image ships a shell, so no healthcheck; services keep retrying the export.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"  # for services run outside Docker (pnpm dev, uvicorn --reload)
    depends_on:
      - jaeger

  # Trace UI on http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"

  core-api:
    build: ../services/core-api
    environment: &core-environment
      CORE_ENVIRONMENT: local  # this file is for dev only; deploys set production (T0.13)
      CORE_DATABASE_URL: postgresql+psycopg://${CORE_DB_USER}:${CORE_DB_PASSWORD}@postgres:5432/${CORE_DB_NAME}
      CORE_REDIS_URL: ${REDIS_URL}
      CORE_AI_SERVICE_URL: ${AI_SERVICE_URL}
      CORE_AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set in .env}
      CORE_SMTP_HOST: ${SMTP_HOST}
      CORE_SMTP_PORT: ${SMTP_PORT}
      CORE_EMAIL_FROM: ${EMAIL_FROM}
      CORE_LOG_HASH_KEY: ${LOG_HASH_KEY:-}
      # Requests carrying this token come from web, so core-api trusts their X-Client-IP.
      CORE_WEB_TOKEN: ${WEB_TO_CORE_TOKEN:?set in .env}
      # Object storage (T4.5): the same S3_* variables storage-init uses. Upload URLs are
      # signed for S3_PUBLIC_ENDPOINT, the address the browser reaches.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  # Background jobs of core-api (ADR-0014): same image and settings, no port.
  core-worker:
    build: ../services/core-api
    command: ["uv", "run", "--no-sync", "python", "-m", "core_api.jobs.worker"]
    environment: *core-environment
    # Above the worker's 20 s wait for a running job (core_api/jobs/worker.py).
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Sends the outbox to Redis Streams every second (T4.2, ADR-0006). On SIGTERM it finishes the
  # round it is in (one batch, well under a second) and stops; a round cut short is sent again.
  core-relay:
    build: ../services/core-api
    command: ["uv", "run", "--no-sync", "python", "-m", "core_api.messaging.relay"]
    environment: *core-environment
    stop_grace_period: 10s
    # A round that fails is logged and retried, but the process can still die (out of memory,
    # Redis refusing at start): events are owed, so bring it back.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build: ../services/ai-service
    environment:
      AI_ENVIRONMENT: local  # this file is for dev only; deploys set production (T0.13)
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set in .env}
      AI_DATABASE_URL: postgresql+psycopg://${AI_DB_USER}:${AI_DB_PASSWORD}@postgres:5432/${AI_DB_NAME}
      AI_REDIS_URL: ${REDIS_URL}
      # fake grades without a model (dev only, refused outside local/test); anthropic needs
      # ANTHROPIC_API_KEY; disabled answers 503 grading_disabled.
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      CORE_API_URL: ${CORE_API_URL}
      WEB_TO_CORE_TOKEN: ${WEB_TO_CORE_TOKEN:?set in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?set in .env}
      # No proxy in front of web, and a route handler cannot see the socket's address, so web
      # sends no X-Client-IP and core-api sees web's container: one rate-limit bucket for
      # everyone. Fine for one local user; production sets the real number (ADR-0022).
      WEB_TRUSTED_PROXY_HOPS: ${WEB_TRUSTED_PROXY_HOPS:?set in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      core-api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  storage-data:
