[project]
name = "ai-service"
version = "0.1.0"
description = "Essity AI service: LLM tasks, PDF/image processing, evals."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3.6",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "anthropic>=1.13.0,<2",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "httpx2>=2.13.1",
    "pypdf>=6.20.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-randomly>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "migrations"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
