# Alembic configuration for core-api. Run from services/core-api:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate --rev-id 0002 -m "short description"
# The database URL comes from CORE_DATABASE_URL (see migrations/env.py), never from this file.
# There is no [loggers] section on purpose: logging.config.fileConfig would disable the app's
# loggers when migrations run inside the tests.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
