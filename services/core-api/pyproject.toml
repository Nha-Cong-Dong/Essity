[project]
name = "core-api"
version = "0.1.0"
description = "Essity core API: auth, review logic, scheduling."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "fsrs>=6,<7",
    "tzdata>=2026.5",
    "httpx2>=2.13.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3.6",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    # <2.1: opentelemetry-instrumentation-sqlalchemy 0.66b1 supports < 2.1 only and silently
    # instruments nothing on 2.1. Raise when it supports 2.1.
    "sqlalchemy>=2.0.54,<2.1",
    "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-randomly>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "migrations"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
